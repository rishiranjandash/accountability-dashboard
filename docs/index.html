<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warehouse Leaders — Accountability Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg: #f4f5f3;
    --surface: #ffffff;
    --surface-2: #eceeea;
    --border: #d8dad4;
    --ink: #1b2420;
    --ink-dim: #5a6660;
    --accent: #c9631a;
    --accent-ink: #ffffff;
    --good: #1f7a4d;
    --good-bg: #e3f3ea;
    --bad: #b0362a;
    --bad-bg: #fbe9e6;
    --warn: #a3720f;
    --warn-bg: #fbf0dc;
    --neutral-bg: #eceeea;
    --shadow: 0 1px 2px rgba(20,25,20,0.06), 0 4px 14px rgba(20,25,20,0.05);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg: #14171a;
      --surface: #1c2023;
      --surface-2: #23282b;
      --border: #33393d;
      --ink: #eef0ee;
      --ink-dim: #a3aca6;
      --accent: #e2833f;
      --accent-ink: #14171a;
      --good: #4fbf88;
      --good-bg: #163427;
      --bad: #e2695c;
      --bad-bg: #3a1e1b;
      --warn: #e0b34e;
      --warn-bg: #3a2f14;
      --neutral-bg: #23282b;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding-inline: max(16px, env(safe-area-inset-left));
    padding-block: 20px 48px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  header.top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
    margin-bottom:14px;
  }
  header.top h1{
    font-size:1.15rem; font-weight:700; margin:0; letter-spacing:-0.01em;
  }
  header.top .eyebrow{
    display:block; font-family:"IBM Plex Mono",monospace; font-size:0.68rem;
    text-transform:uppercase; letter-spacing:0.08em; color:var(--accent); margin-bottom:2px;
  }
  #date-line{font-family:"IBM Plex Mono",monospace; font-size:0.78rem; color:var(--ink-dim); margin-top:2px;}

  /* ── Sign-in / identity chip ─────────────────────────────────────────── */
  #auth-area{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #gsi-button-slot{ line-height:0; }
  .who-chip{
    display:flex; align-items:center; gap:8px; background:var(--surface);
    border:1px solid var(--border); border-radius:100px; padding:5px 12px 5px 5px;
    box-shadow:var(--shadow); font-size:0.8rem;
  }
  .who-chip img{ width:22px; height:22px; border-radius:50%; display:block; background:var(--surface-2); }
  .who-chip .who-name{ font-weight:600; }
  .who-chip .who-signout{
    appearance:none; border:none; background:none; color:var(--ink-dim); font-family:inherit;
    font-size:0.72rem; text-decoration:underline; cursor:pointer; padding:0; margin-left:2px;
  }
  .who-chip.unrecognized{ border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); }
  .who-note{ font-size:0.7rem; color:var(--warn); max-width:220px; text-align:right; line-height:1.35; }

  nav.tabs{
    display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--border);
    overflow-x:auto;
  }
  nav.tabs button{
    appearance:none; border:none; background:transparent; color:var(--ink-dim);
    font-family:inherit; font-size:0.85rem; font-weight:600; padding:9px 12px;
    cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
  }
  nav.tabs button.active{ color:var(--ink); border-bottom-color:var(--accent); }
  nav.tabs button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .summary-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
    gap:8px; margin-bottom:18px;
  }
  .stat{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:10px 12px; box-shadow:var(--shadow);
  }
  .stat .n{ font-family:"IBM Plex Mono",monospace; font-size:1.3rem; font-weight:600;
    font-variant-numeric: tabular-nums; }
  .stat .l{ font-size:0.68rem; color:var(--ink-dim); text-transform:uppercase; letter-spacing:0.05em; }

  section.shift{ margin-bottom:22px; }
  section.shift > h2{
    font-size:0.78rem; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--ink-dim); font-weight:600; margin:0 0 8px 2px;
  }
  ul.board{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li.task{
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px; box-shadow:var(--shadow);
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    flex-wrap:wrap;
  }
  li.task.is-missed{ border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
  li.task.is-mine{ border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); border-width:1.5px; }
  .task-main{ min-width:0; flex:1 1 200px; }
  .task-name{ font-weight:600; font-size:0.92rem; line-height:1.3; }
  .task-meta{
    font-family:"IBM Plex Mono",monospace; font-size:0.72rem; color:var(--ink-dim);
    margin-top:3px; display:flex; gap:8px; flex-wrap:wrap;
  }
  .task-side{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:0 0 auto; }
  .pill{
    flex:0 0 auto; font-size:0.68rem; font-weight:600; text-transform:uppercase;
    letter-spacing:0.03em; padding:4px 9px; border-radius:100px; white-space:nowrap;
    font-family:"IBM Plex Mono",monospace;
  }
  .pill.done{ background:var(--good-bg); color:var(--good); }
  .pill.pending{ background:var(--neutral-bg); color:var(--ink-dim); }
  .pill.missed{ background:var(--bad-bg); color:var(--bad); }
  .pill.leave{ background:var(--warn-bg); color:var(--warn); }
  .pill.mine{ background:color-mix(in srgb, var(--accent) 18%, var(--surface)); color:var(--accent); }

  .btn-vote{
    appearance:none; border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink);
    font-family:inherit; font-size:0.72rem; font-weight:600; padding:6px 12px; border-radius:8px;
    cursor:pointer; white-space:nowrap;
  }
  .btn-vote:hover{ filter:brightness(1.06); }
  .btn-vote:disabled{ opacity:0.55; cursor:default; }

  table{ width:100%; border-collapse:collapse; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:var(--shadow); }
  th,td{ text-align:left; padding:9px 11px; font-size:0.82rem; border-bottom:1px solid var(--border); }
  th{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-dim);
    background:var(--surface-2); font-weight:600; }
  tr:last-child td{ border-bottom:none; }
  td.num, th.num{ font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right; }
  .table-wrap{ overflow-x:auto; }

  .empty{ color:var(--ink-dim); font-size:0.85rem; padding:16px; text-align:center;
    background:var(--surface); border:1px dashed var(--border); border-radius:10px; }
  .status-line{ font-family:"IBM Plex Mono",monospace; font-size:0.72rem; color:var(--ink-dim);
    margin-top:22px; text-align:center; }
  .status-line.err{ color:var(--bad); }

  a{ color:var(--accent); }

  /* ── Vote / proof-upload modal ───────────────────────────────────────── */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,14,10,0.5); display:flex;
    align-items:flex-end; justify-content:center; z-index:50; padding:0;
  }
  @media (min-width:560px){
    .modal-overlay{ align-items:center; padding:16px; }
  }
  .modal-card{
    background:var(--surface); width:100%; max-width:440px; border-radius:16px 16px 0 0;
    box-shadow:0 -8px 30px rgba(0,0,0,0.25); padding:18px 18px 20px;
    max-height:88vh; overflow-y:auto;
  }
  @media (min-width:560px){
    .modal-card{ border-radius:16px; box-shadow:var(--shadow); }
  }
  .modal-card h3{ margin:0 0 4px; font-size:1rem; }
  .modal-card .modal-sub{ font-size:0.78rem; color:var(--ink-dim); margin:0 0 16px; }
  .modal-card .modal-sub b{ color:var(--ink); }
  .proof-drop{
    border:1.5px dashed var(--border); border-radius:12px; padding:18px; text-align:center;
    cursor:pointer; background:var(--surface-2); margin-bottom:14px;
  }
  .proof-drop:hover{ border-color:var(--accent); }
  .proof-drop .hint{ font-size:0.78rem; color:var(--ink-dim); }
  .proof-preview{ display:none; margin-bottom:14px; }
  .proof-preview.show{ display:block; }
  .proof-preview img{
    max-width:100%; max-height:220px; border-radius:10px; border:1px solid var(--border); display:block;
    margin:0 auto 8px;
  }
  .proof-preview .swap{
    display:block; text-align:center; font-size:0.75rem; background:none; border:none;
    color:var(--accent); text-decoration:underline; cursor:pointer; font-family:inherit;
  }
  .modal-actions{ display:flex; gap:10px; margin-top:4px; }
  .modal-actions button{
    flex:1; appearance:none; border-radius:9px; padding:11px 14px; font-family:inherit;
    font-size:0.85rem; font-weight:600; cursor:pointer;
  }
  #vote-cancel{ background:var(--surface-2); border:1px solid var(--border); color:var(--ink); }
  #vote-submit{ background:var(--accent); border:1px solid var(--accent); color:var(--accent-ink); }
  #vote-submit:disabled{ opacity:0.55; cursor:default; }
  .modal-error{
    display:none; background:var(--bad-bg); color:var(--bad); font-size:0.78rem;
    border-radius:8px; padding:9px 11px; margin-bottom:12px; line-height:1.4;
  }
  .modal-error.show{ display:block; }
  .modal-close{
    position:absolute; top:10px; right:14px; appearance:none; border:none; background:none;
    font-size:1.3rem; color:var(--ink-dim); cursor:pointer; line-height:1;
  }
  .modal-card{ position:relative; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <span class="eyebrow">Warehouse Leaders</span>
      <h1>Accountability Board</h1>
      <div id="date-line">—</div>
    </div>
    <div id="auth-area">
      <div id="gsi-button-slot"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="active" data-tab="today" role="tab" aria-selected="true">Today</button>
    <button data-tab="leaderboard" role="tab" aria-selected="false">Leaderboard</button>
    <button data-tab="leave" role="tab" aria-selected="false">Leave Tracker</button>
    <button data-tab="slippage" role="tab" aria-selected="false">Slippage</button>
  </nav>

  <div id="panel-today">
    <div class="summary-row" id="summary-row"></div>
    <div id="today-board"></div>
  </div>

  <div id="panel-leaderboard" hidden>
    <div class="table-wrap" id="leaderboard-table"></div>
  </div>

  <div id="panel-leave" hidden>
    <div class="table-wrap" id="leave-table"></div>
  </div>

  <div id="panel-slippage" hidden>
    <div class="table-wrap" id="slippage-table"></div>
  </div>

  <div class="status-line" id="status-line">loading…</div>
</div>

<!-- ── Vote / proof-of-vote modal (hidden until a "Mark done" button is clicked) ── -->
<div class="modal-overlay" id="vote-modal" hidden>
  <div class="modal-card">
    <button class="modal-close" id="vote-close" aria-label="Close">&times;</button>
    <h3>Mark task done</h3>
    <p class="modal-sub" id="vote-task-label"></p>
    <div class="modal-error" id="vote-error"></div>
    <div class="proof-drop" id="proof-drop">
      <div class="hint">Tap to attach a screenshot as proof<br>(required before this can be marked done)</div>
    </div>
    <div class="proof-preview" id="proof-preview">
      <img id="proof-img" alt="Proof preview">
      <button class="swap" id="proof-swap" type="button">Choose a different image</button>
    </div>
    <input type="file" id="proof-input" accept="image/*" hidden>
    <div class="modal-actions">
      <button id="vote-cancel" type="button">Cancel</button>
      <button id="vote-submit" type="button" disabled>Mark done</button>
    </div>
  </div>
</div>

<script>
// ── Configure after deploying the Apps Script Web App ──────────────────────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxisFqxkgGtvejAoSFoFe1ZUX18LEuPgsKlKsUY2LZYgFVJrvgIYNsUlx031_jfC5rnhA/exec';

// OAuth 2.0 Web Client ID from Google Cloud Console ("Sign in with Google").
// Leave blank until it's created (Google Sign-In stays disabled — a note is
// shown instead of the sign-in button). Must exactly match OAUTH_CLIENT_ID
// in Code.gs once filled in.
const GOOGLE_CLIENT_ID = '';
// ─────────────────────────────────────────────────────────────────────────

const REFRESH_MS = 60000; // auto-refresh the Today board every 60s
const AUTH_STORAGE_KEY = 'wl_auth_v1';

function fmtDate(){
  return new Date().toLocaleString('en-IN', {
    weekday:'short', day:'2-digit', month:'short',
    hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kolkata'
  });
}
document.getElementById('date-line').textContent = fmtDate();
setInterval(() => { document.getElementById('date-line').textContent = fmtDate(); }, 30000);

async function fetchJSON(action){
  // cache-buster (_t) + no-store: Apps Script /exec URLs are easy for the
  // browser to cache since they're plain GETs, which serves stale data
  // after a redeploy or when task status changes during the day.
  const url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes('?') ? '&' : '?') + 'action=' + action + '&_t=' + Date.now();
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function postJSON(action, body){
  // text/plain avoids a CORS preflight against the Apps Script /exec
  // endpoint; Code.gs parses e.postData.contents as JSON regardless of the
  // declared content type. action travels as a query param, matching how
  // doPost() reads e.parameter.action.
  const url = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.includes('?') ? '&' : '?') + 'action=' + action;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body || {})
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function pillClass(status, onLeave){
  if (onLeave) return 'leave';
  if (status === 'Done') return 'done';
  if (status === 'Missed') return 'missed';
  return 'pending';
}

// ── Auth state ──────────────────────────────────────────────────────────
// auth.idToken is kept in memory only (never persisted — it's short-lived
// anyway); auth.name/email are cached in localStorage purely so the UI can
// show "signed in as …" instantly on reload while Google Identity Services
// silently re-authenticates in the background (see initGoogleSignIn below).
let auth = { idToken: null, name: null, email: null, recognized: false, message: '' };
let lastTasks = [];

function saveAuthCache(){
  try{
    localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({ name: auth.name, email: auth.email, recognized: auth.recognized }));
  }catch(e){ /* private browsing / storage disabled — fine, just skip caching */ }
}
function loadAuthCache(){
  try{
    const raw = localStorage.getItem(AUTH_STORAGE_KEY);
    if (!raw) return;
    const cached = JSON.parse(raw);
    auth.name = cached.name || null;
    auth.email = cached.email || null;
    auth.recognized = !!cached.recognized;
  }catch(e){ /* ignore corrupt cache */ }
}
function clearAuthCache(){
  try{ localStorage.removeItem(AUTH_STORAGE_KEY); }catch(e){}
}

function renderAuthArea(){
  const slot = document.getElementById('gsi-button-slot');
  if (!GOOGLE_CLIENT_ID){
    slot.innerHTML = '<div class="who-note">Google sign-in isn\'t configured yet — voting from the webapp will open once it is.</div>';
    return;
  }
  if (auth.idToken || auth.name){
    const initials = (auth.name || auth.email || '?').trim().charAt(0).toUpperCase();
    slot.innerHTML = `
      <div class="who-chip ${auth.recognized ? '' : 'unrecognized'}">
        <img src="${auth.picture || ''}" onerror="this.style.display='none'" alt="">
        <span class="who-name">${auth.recognized ? auth.name : (auth.email || 'Signed in')}</span>
        <button class="who-signout" id="who-signout">Sign out</button>
      </div>
      ${auth.recognized ? '' : `<div class="who-note">${auth.message || "Your Google account isn't on the Team tab yet — ask Rishi to add it."}</div>`}
    `;
    const out = document.getElementById('who-signout');
    if (out) out.addEventListener('click', signOut);
  } else {
    slot.innerHTML = '';
    try{
      google.accounts.id.renderButton(slot, { theme: 'outline', size: 'medium', shape: 'pill', text: 'signin' });
    }catch(e){ /* GIS script not loaded yet — initGoogleSignIn will retry */ }
  }
}

async function handleCredentialResponse(response){
  auth.idToken = response.credential;
  try{
    const who = await postJSON('whoami', { idToken: auth.idToken });
    if (who.error){ throw new Error(who.error); }
    auth.recognized = !!who.recognized;
    auth.name = who.name || null;
    auth.email = who.email || null;
    auth.message = who.message || '';
    saveAuthCache();
  }catch(err){
    auth.recognized = false;
    auth.message = 'Could not verify sign-in (' + err.message + '). Try signing in again.';
  }
  renderAuthArea();
  renderToday({ tasks: lastTasks });
}

function signOut(){
  auth = { idToken: null, name: null, email: null, recognized: false, message: '' };
  clearAuthCache();
  try{ google.accounts.id.disableAutoSelect(); }catch(e){}
  renderAuthArea();
  renderToday({ tasks: lastTasks });
}

function initGoogleSignIn(){
  if (!GOOGLE_CLIENT_ID){ renderAuthArea(); return; }
  if (typeof google === 'undefined' || !google.accounts || !google.accounts.id){
    // gsi/client script hasn't finished loading yet — retry shortly.
    setTimeout(initGoogleSignIn, 300);
    return;
  }
  loadAuthCache(); // show a cached name instantly while a fresh token is negotiated
  renderAuthArea();
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
    auto_select: true,
    cancel_on_tap_outside: false
  });
  renderAuthArea();
  // Silent re-auth for a returning, already-consented user ("stays logged
  // in" across visits) — falls back to the rendered button with no error if
  // the browser/user declines the prompt.
  try{ google.accounts.id.prompt(); }catch(e){}
}

// ── Today board ─────────────────────────────────────────────────────────
function renderToday(data){
  const tasks = data.tasks || [];
  lastTasks = tasks;
  const done = tasks.filter(t => t.status === 'Done').length;
  const onLeave = tasks.filter(t => t.onLeave).length;
  const pending = tasks.length - done;

  document.getElementById('summary-row').innerHTML = `
    <div class="stat"><div class="n">${tasks.length}</div><div class="l">Tasks today</div></div>
    <div class="stat"><div class="n">${done}</div><div class="l">Done</div></div>
    <div class="stat"><div class="n">${pending}</div><div class="l">Pending</div></div>
    <div class="stat"><div class="n">${onLeave}</div><div class="l">On leave</div></div>
  `;

  // group by rough shift: task text starting with "Day" vs "Night" vs other
  const groups = { 'Day Shift': [], 'Night Shift': [], 'Other': [] };
  tasks.forEach(t => {
    const name = String(t.task || '');
    if (/^day/i.test(name)) groups['Day Shift'].push(t);
    else if (/^night/i.test(name)) groups['Night Shift'].push(t);
    else groups['Other'].push(t);
  });

  const myName = (auth.recognized && auth.name) ? auth.name.trim().toLowerCase() : null;
  const isMine = t => myName && String(t.assignedTo || '').split('/').map(s => s.trim().toLowerCase()).includes(myName);

  const board = document.getElementById('today-board');
  if (tasks.length === 0) {
    board.innerHTML = '<div class="empty">No active tasks found in the sheet.</div>';
    return;
  }
  board.innerHTML = Object.entries(groups).filter(([,list]) => list.length).map(([label, list]) => `
    <section class="shift">
      <h2>${label}</h2>
      <ul class="board">
        ${list.map(t => {
          const mine = isMine(t);
          const canVote = mine && !t.onLeave && t.status !== 'Done';
          return `
          <li class="task ${t.status==='Missed' ? 'is-missed' : ''} ${mine ? 'is-mine' : ''}">
            <div class="task-main">
              <div class="task-name">${t.task}</div>
              <div class="task-meta">
                <span>${t.assignedTo}${t.onLeave ? ' → covered by ' + (t.coveredBy || '?') : ''}</span>
                <span>cutoff ${t.cutoff}</span>
              </div>
            </div>
            <div class="task-side">
              <span class="pill ${pillClass(t.status, t.onLeave)}">${t.onLeave ? 'On leave' : t.status}</span>
              ${mine && !canVote && t.status !== 'Done' ? '' : (mine ? '<span class="pill mine">Yours</span>' : '')}
              ${canVote ? `<button class="btn-vote" data-task="${encodeURIComponent(t.task)}">Mark done</button>` : ''}
            </div>
          </li>
        `;}).join('')}
      </ul>
    </section>
  `).join('');

  board.querySelectorAll('.btn-vote').forEach(btn => {
    btn.addEventListener('click', () => openVoteModal(decodeURIComponent(btn.dataset.task)));
  });
}

function renderTable(el, rows, columns){
  if (!rows || rows.length === 0){
    el.innerHTML = '<div class="empty">No rows yet.</div>';
    return;
  }
  const cols = columns || Object.keys(rows[0]);
  el.innerHTML = `
    <table>
      <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
      <tbody>
        ${rows.map(r => `<tr>${cols.map(c => `<td>${r[c] ?? ''}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table>
  `;
}

let loaded = { leaderboard:false, leave:false, slippage:false };

async function loadToday(){
  const data = await fetchJSON('tasks');
  renderToday(data);
}
async function loadLeaderboard(){
  const data = await fetchJSON('leaderboard');
  renderTable(document.getElementById('leaderboard-table'), data.rows,
    ['Name','Group','Total Points','Tasks Done','Tasks Missed','Completion Rate']);
}
async function loadLeave(){
  const data = await fetchJSON('leave');
  renderTable(document.getElementById('leave-table'), data.rows,
    ['Name','On Leave Today (Y/N)','Covered By','Notes']);
}
async function loadSlippage(){
  const data = await fetchJSON('slippage');
  renderTable(document.getElementById('slippage-table'), data.rows,
    ['Name','Group','Missed (Last 3 Days)','Missed (All-Time)','Completion Rate','Status']);
}

const statusLine = document.getElementById('status-line');
async function refreshToday(){
  try{
    await loadToday();
    statusLine.textContent = 'updated ' + new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'});
    statusLine.classList.remove('err');
  }catch(err){
    statusLine.textContent = APPS_SCRIPT_URL.includes('PASTE_YOUR')
      ? 'Not connected yet — set APPS_SCRIPT_URL in index.html after deploying the Apps Script backend.'
      : 'Could not reach the backend (' + err.message + '). Retrying…';
    statusLine.classList.add('err');
  }
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', async () => {
    document.querySelectorAll('nav.tabs button').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
    btn.classList.add('active'); btn.setAttribute('aria-selected','true');
    ['today','leaderboard','leave','slippage'].forEach(t => {
      document.getElementById('panel-' + t).hidden = (t !== btn.dataset.tab);
    });
    try{
      if (btn.dataset.tab === 'leaderboard' && !loaded.leaderboard){ await loadLeaderboard(); loaded.leaderboard = true; }
      if (btn.dataset.tab === 'leave' && !loaded.leave){ await loadLeave(); loaded.leave = true; }
      if (btn.dataset.tab === 'slippage' && !loaded.slippage){ await loadSlippage(); loaded.slippage = true; }
    }catch(err){
      statusLine.textContent = 'Could not load tab (' + err.message + ')';
      statusLine.classList.add('err');
    }
  });
});

// ── Vote / proof-of-vote modal ─────────────────────────────────────────────
const voteModal = document.getElementById('vote-modal');
const voteTaskLabel = document.getElementById('vote-task-label');
const voteError = document.getElementById('vote-error');
const proofDrop = document.getElementById('proof-drop');
const proofInput = document.getElementById('proof-input');
const proofPreview = document.getElementById('proof-preview');
const proofImg = document.getElementById('proof-img');
const voteSubmit = document.getElementById('vote-submit');
let voteState = { task: null, base64: null, mimeType: null, filename: null };

function resetVoteModal(){
  voteState = { task: null, base64: null, mimeType: null, filename: null };
  proofInput.value = '';
  proofPreview.classList.remove('show');
  proofDrop.style.display = '';
  voteError.classList.remove('show');
  voteError.textContent = '';
  voteSubmit.disabled = true;
  voteSubmit.textContent = 'Mark done';
}

function openVoteModal(taskName){
  resetVoteModal();
  voteState.task = taskName;
  voteTaskLabel.innerHTML = 'For <b>' + taskName + '</b>, signed in as <b>' + (auth.name || '') + '</b>.';
  voteModal.hidden = false;
}
function closeVoteModal(){ voteModal.hidden = true; }

document.getElementById('vote-close').addEventListener('click', closeVoteModal);
document.getElementById('vote-cancel').addEventListener('click', closeVoteModal);
voteModal.addEventListener('click', (e) => { if (e.target === voteModal) closeVoteModal(); });

proofDrop.addEventListener('click', () => proofInput.click());
document.getElementById('proof-swap').addEventListener('click', () => proofInput.click());

proofInput.addEventListener('change', () => {
  const file = proofInput.files && proofInput.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')){
    voteError.textContent = 'Please choose an image file (screenshot/photo).';
    voteError.classList.add('show');
    return;
  }
  if (file.size > 8 * 1024 * 1024){
    voteError.textContent = 'That image is larger than 8MB — please choose a smaller screenshot.';
    voteError.classList.add('show');
    return;
  }
  voteError.classList.remove('show');
  const reader = new FileReader();
  reader.onload = () => {
    const dataUrl = String(reader.result || '');
    const commaIdx = dataUrl.indexOf(',');
    voteState.base64 = dataUrl.slice(commaIdx + 1);
    voteState.mimeType = file.type;
    voteState.filename = file.name || 'proof.jpg';
    proofImg.src = dataUrl;
    proofPreview.classList.add('show');
    proofDrop.style.display = 'none';
    voteSubmit.disabled = false;
  };
  reader.onerror = () => {
    voteError.textContent = 'Could not read that image — please try again.';
    voteError.classList.add('show');
  };
  reader.readAsDataURL(file);
});

voteSubmit.addEventListener('click', async () => {
  if (!voteState.base64 || !voteState.task) return;
  voteSubmit.disabled = true;
  voteSubmit.textContent = 'Marking done…';
  voteError.classList.remove('show');
  try{
    const result = await postJSON('vote', {
      idToken: auth.idToken,
      task: voteState.task,
      proofBase64: voteState.base64,
      proofMimeType: voteState.mimeType,
      proofFilename: voteState.filename
    });
    if (result.error){
      voteError.textContent = result.error;
      voteError.classList.add('show');
      voteSubmit.disabled = false;
      voteSubmit.textContent = 'Mark done';
      return;
    }
    closeVoteModal();
    statusLine.textContent = 'Marked "' + voteState.task + '" done — refreshing…';
    await refreshToday();
  }catch(err){
    voteError.textContent = 'Could not submit (' + err.message + '). Please try again.';
    voteError.classList.add('show');
    voteSubmit.disabled = false;
    voteSubmit.textContent = 'Mark done';
  }
});

initGoogleSignIn();
refreshToday();
setInterval(refreshToday, REFRESH_MS);
</script>
